[package]
name = "drydock"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
futures = "0.3.34"
getrandom = "0.4.3"
hyper-util = { version = "0.1.21", features = ["server-auto", "server-graceful", "service", "tokio", "http1"] }
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "form", "rustls-no-provider", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
yaml_serde = "0.10.7"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
