# Tests, dependency audit and image scan on every change, plus a weekly run so
# that new advisories are caught even when the code does not change.
# Actions are pinned by commit SHA (tag in comment); Dependabot keeps them current.
name: security

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Unit tests
        run: cargo test --locked
      - name: Dependency audit (RustSec)
        run: |
          # Pinned: Dependabot does not update `cargo install` lines, bump by hand.
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit --deny warnings

  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t drydock:ci .
      - name: Scan image (HIGH/CRITICAL fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: drydock:ci
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Scan Dockerfile and compose configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL
